# CI: składnia, testy jednostkowe czystych modułów, ESLint, smoke w headless Chrome,
# audyt zależności backendu oraz analiza CodeMap samego repozytorium (akcja z tego repo).
# Bez kroku budowania — aplikacja jest statyczna.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Składnia (node --check)
        run: npm run check
      - name: Testy jednostkowe
        run: npm test
      - name: Rozszerzenie VS Code (bundle, atrapa vscode, analiza w wątku)
        run: npm run vscode-test
      - name: ESLint
        run: npm run lint
      - name: Smoke w headless Chrome (demo → mapa, 0 wyjątków)
        run: npm run smoke
        env:
          CHROME: /usr/bin/google-chrome
      # czasy wczytania i klatki (canvas 2D vs WebGL) na syntetycznych projektach 5k / 20k plików — informacyjnie,
      # bez progu (runner bez GPU); tabela w podsumowaniu, JSON jako artefakt do porównań między commitami
      - name: Benchmark renderera (informacyjnie)
        run: node tools/bench.mjs --n 5000,20000 --json bench.json --summary
        env:
          CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Audyt zależności (high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Testy backendu (node:test, app.inject na tymczasowej bazie)
        run: npm test
      - name: Serwer wstaje i odpowiada na /api/health
        run: |
          cp .env.example .env
          node --env-file=.env index.js > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8787/api/health && ok=1 && break; sleep 0.5; done
          cat server.log
          test "$ok" = "1"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/server/.env)" = "404"

  # CodeMap na własnym kodzie przez akcję z tego repozytorium (action.yml): raport w podsumowaniu kroku,
  # SARIF i Markdown jako artefakt. BEZ progów — repozytorium ma dziś niski health score (duplikaty,
  # złożone pliki), więc job niczego nie blokuje; SARIF nie jest wysyłany do code scanning.
  codemap:
    runs-on: ubuntu-latest
    # jakość własnego kodu: próg health score, a w PR — „nie pogarszaj" względem bazy i komentarz z ryzykiem zmian
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # pełna historia git → hotspoty zmian, bus factor, baza PR
      - id: codemap
        uses: ./
        with:
          sarif: codemap.sarif
          markdown: codemap.md
          args: --exclude .claude
          min-score: 35          # zapas: reguły git (hotspoty) zmieniają się z każdym commitem; w PR pilnuje max-score-drop
          max-score-drop: 0       # działa tylko z bazą, czyli w PR (na push baza jest pusta)
          pr-comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Wynik
        if: always()
        run: echo "CodeMap health score ${{ steps.codemap.outputs.score }}/100, znalezisk ${{ steps.codemap.outputs.findings }}, ryzyko zmian ${{ steps.codemap.outputs.risk }}, zmiana wyniku ${{ steps.codemap.outputs.score-delta }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codemap-report
          path: |
            codemap.sarif
            codemap.md
          if-no-files-found: warn
