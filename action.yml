# CodeMap — akcja GitHub (kompozytowa): ta sama analiza co w aplikacji, uruchomiona w CI przez
# cli/codemap.mjs (Node, bez zależności npm). Raport Markdown trafia do podsumowania kroku,
# SARIF do pliku (np. do github/codeql-action/upload-sarif), progi ustawiają kod wyjścia.
# Przykłady: docs/github-action.md
name: 'CodeMap — analiza kodu'
description: 'Mapa zależności, cykle, hotspoty z historii git, testy i pokrycie, reguły architektury — raport SARIF i Markdown, progi health score.'
author: 'RaCzKoViC'
branding:
  icon: 'map'
  color: 'blue'

inputs:
  path:
    description: 'Katalog do analizy (względem katalogu roboczego).'
    required: false
    default: '.'
  min-score:
    description: 'Minimalny health score (0–100); niższy wynik kończy krok porażką. Puste = bez progu.'
    required: false
    default: ''
  fail-on:
    description: 'Porażka, gdy wystąpią znaleziska: poziom ważności (high | med | low | info — ten lub wyższy) albo identyfikatory reguł, po przecinku (np. "cycles,archviolation"). Puste = bez progu.'
    required: false
    default: ''
  max-findings:
    description: 'Porażka, gdy znalezisk łącznie jest więcej niż N. Puste = bez progu.'
    required: false
    default: ''
  sarif:
    description: 'Ścieżka pliku SARIF 2.1.0. Puste = bez SARIF.'
    required: false
    default: 'codemap.sarif'
  markdown:
    description: 'Ścieżka pliku z raportem Markdown (raport i tak trafia do podsumowania kroku). Puste = plik tymczasowy.'
    required: false
    default: ''
  architecture:
    description: 'Ścieżka, pod którą zapisać ARCHITECTURE.md wygenerowany z mapy (warstwy, pakiety, rdzeń, hotspoty, testy, cykle). Puste = bez.'
    required: false
    default: ''
  lang:
    description: 'Język raportów: pl | en.'
    required: false
    default: 'pl'
  git:
    description: 'Czytać historię git z .git (hotspoty zmian, wiedza w jednej głowie, bus factor). Pełna historia wymaga actions/checkout z fetch-depth: 0.'
    required: false
    default: 'true'
  args:
    description: 'Dodatkowe argumenty CLI (np. "--coverage coverage/lcov.info --exclude docs/**").'
    required: false
    default: ''
  node-version:
    description: 'Wersja Node.js (≥ 20.6).'
    required: false
    default: '22'
  base:
    description: 'Ref bazowy przeglądu zmian (git diff <base>...HEAD): ryzyko zmian, pliki zależne, recenzenci. W zdarzeniu pull_request domyślnie baza PR. Wymaga actions/checkout z fetch-depth: 0.'
    required: false
    default: ''
  baseline:
    description: 'Policz health score dla bazy (tymczasowy git worktree) i nowe znaleziska względem niej.'
    required: false
    default: 'true'
  max-score-drop:
    description: 'Porażka, gdy health score spadnie względem bazy o więcej niż N (0 = „nie pogarszaj"). Puste = bez progu.'
    required: false
    default: ''
  pr-comment:
    description: 'W zdarzeniu pull_request: dodaj / zaktualizuj komentarz CodeMap w PR (wymaga permissions: pull-requests: write).'
    required: false
    default: 'false'
  map-link:
    description: 'Dodaj do komentarza link do mapy wpływu PR w aplikacji CodeMap (działa dla publicznych repozytoriów).'
    required: false
    default: 'true'
  github-token:
    description: 'Token do komentarza w PR.'
    required: false
    default: ${{ github.token }}

outputs:
  score:
    description: 'Health score projektu (0–100).'
    value: ${{ steps.analyze.outputs.score }}
  findings:
    description: 'Łączna liczba znalezisk.'
    value: ${{ steps.analyze.outputs.findings }}
  sarif-file:
    description: 'Ścieżka zapisanego pliku SARIF (pusta, gdy wyłączony).'
    value: ${{ steps.analyze.outputs.sarif-file }}
  risk:
    description: 'Ryzyko zmian względem bazy (0–100; puste bez przeglądu zmian).'
    value: ${{ steps.analyze.outputs.risk }}
  score-delta:
    description: 'Zmiana health score względem bazy (puste bez baseline).'
    value: ${{ steps.analyze.outputs.score-delta }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - id: analyze
      shell: bash
      # wejścia przez zmienne środowiskowe, nie wklejane w skrypt (bez wstrzykiwania poleceń)
      env:
        CM_PATH: ${{ inputs.path }}
        CM_MIN_SCORE: ${{ inputs.min-score }}
        CM_FAIL_ON: ${{ inputs.fail-on }}
        CM_MAX_FINDINGS: ${{ inputs.max-findings }}
        CM_SARIF: ${{ inputs.sarif }}
        CM_ARCH: ${{ inputs.architecture }}
        CM_MARKDOWN: ${{ inputs.markdown }}
        CM_LANG: ${{ inputs.lang }}
        CM_GIT: ${{ inputs.git }}
        CM_ARGS: ${{ inputs.args }}
        CM_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        CM_BASELINE: ${{ inputs.baseline }}
        CM_MAX_DROP: ${{ inputs.max-score-drop }}
        CM_PR_COMMENT: ${{ inputs.pr-comment }}
        CM_MAP_LINK: ${{ inputs.map-link }}
        CM_PR_NUMBER: ${{ github.event.pull_request.number }}
        CM_PR_TITLE: ${{ github.event.pull_request.title }}
        CM_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        CM_HEAD_REF: ${{ github.head_ref }}
        CM_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -uo pipefail
        tmp="${RUNNER_TEMP:-/tmp}/codemap-$$"
        mkdir -p "$tmp"
        md="${CM_MARKDOWN:-$tmp/codemap.md}"
        json="$tmp/codemap.json"
        args=(analyze "$CM_PATH" --lang "$CM_LANG" --json "$json" --md "$md")
        [ -n "$CM_SARIF" ] && args+=(--sarif "$CM_SARIF")
        [ -n "$CM_ARCH" ] && args+=(--architecture "$CM_ARCH")
        [ -n "$CM_MIN_SCORE" ] && args+=(--min-score "$CM_MIN_SCORE")
        [ -n "$CM_FAIL_ON" ] && args+=(--fail-on "$CM_FAIL_ON")
        [ -n "$CM_MAX_FINDINGS" ] && args+=(--max-findings "$CM_MAX_FINDINGS")
        case "$CM_GIT" in false|False|FALSE|0|no|off) args+=(--no-git) ;; esac
        prmd=""
        if [ -n "$CM_BASE" ]; then
          # płytki checkout nie ma bazy — dociągnij ją (bez błędu, gdy już jest)
          git rev-parse --verify --quiet "$CM_BASE^{commit}" >/dev/null || git fetch --no-tags --quiet origin "$CM_BASE" || true
          prmd="$tmp/codemap-pr.md"
          args+=(--base "$CM_BASE" --pr-md "$prmd")
          case "$CM_BASELINE" in true|True|TRUE|1|yes|on) args+=(--baseline) ;; esac
          [ -n "$CM_MAX_DROP" ] && args+=(--max-score-drop "$CM_MAX_DROP")
          [ -n "$CM_PR_NUMBER" ] && args+=(--pr-number "$CM_PR_NUMBER")
          [ -n "$CM_PR_TITLE" ] && args+=(--pr-title "$CM_PR_TITLE")
          [ -n "$CM_PR_AUTHOR" ] && args+=(--pr-author "$CM_PR_AUTHOR")
          if [ -n "$CM_PR_NUMBER" ] && [ "$CM_MAP_LINK" = "true" ]; then
            args+=(--pr-link "https://raczkovic.github.io/CodeMap/#repo=${CM_REPO}&pr=${CM_PR_NUMBER}")
          fi
        fi
        if [ -n "$CM_ARGS" ]; then read -r -a extra <<< "$CM_ARGS"; args+=("${extra[@]}"); fi

        node "$GITHUB_ACTION_PATH/cli/codemap.mjs" "${args[@]}"
        code=$?

        if [ -n "$prmd" ] && [ -f "$prmd" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$prmd" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
        if [ -f "$md" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$md" >> "$GITHUB_STEP_SUMMARY"; fi
        # komentarz w PR: jeden, aktualizowany przy kolejnych pushach (znacznik w treści)
        case "$CM_PR_COMMENT" in true|True|TRUE|1|yes|on)
          if [ -n "$CM_PR_NUMBER" ] && [ -n "$prmd" ] && [ -f "$prmd" ]; then
            marker='<!-- codemap-pr-comment -->'
            body="$(printf '%s\n%s' "$marker" "$(cat "$prmd")")"
            cid="$(gh api "repos/$CM_REPO/issues/$CM_PR_NUMBER/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" 2>/dev/null | head -n1 || true)"
            if [ -n "$cid" ]; then gh api -X PATCH "repos/$CM_REPO/issues/comments/$cid" -f body="$body" >/dev/null || echo "::warning::CodeMap: nie udało się zaktualizować komentarza w PR"
            else gh api "repos/$CM_REPO/issues/$CM_PR_NUMBER/comments" -f body="$body" >/dev/null || echo "::warning::CodeMap: nie udało się dodać komentarza w PR (permissions: pull-requests: write?)"; fi
          fi ;;
        esac
        if [ -f "$json" ]; then
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log("score="+r.score);console.log("findings="+r.totals.findings);console.log("risk="+(r.pr?r.pr.risk:""));console.log("score-delta="+(r.baseline?r.baseline.delta:""))' "$json" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$CM_SARIF" ] && [ -f "$CM_SARIF" ]; then echo "sarif-file=$CM_SARIF" >> "$GITHUB_OUTPUT"; else echo "sarif-file=" >> "$GITHUB_OUTPUT"; fi
        exit $code
